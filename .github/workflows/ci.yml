name: CI Tests

on:
  push:
    branches: [ development ]
  pull_request:
    branches: [ development ]

jobs:
  test-sqlite:
    name: SQLite Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
        dependency-version: [prefer-stable]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pdo, sqlite, pdo_sqlite
          coverage: none

      - name: Validate composer.json
        run: composer validate --no-check-all

      - name: Install dependencies
        run: composer update --${{ matrix.dependency-version }} --prefer-dist --no-interaction

      - name: Execute SQLite tests
        run: vendor/bin/phpunit --display-deprecations --display-warnings

  test-postgres:
    name: PostgreSQL Integration (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
        dependency-version: [prefer-stable]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sentinel_pg_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pdo, pgsql, pdo_pgsql
          coverage: none

      - name: Install dependencies
        run: composer update --${{ matrix.dependency-version }} --prefer-dist --no-interaction

      - name: Create PostgreSQL shadow test database
        run: |
          sudo apt-get install -y postgresql-client
          PGPASSWORD=password psql -h 127.0.0.1 -U postgres -d postgres -c "CREATE DATABASE sentinel_pg_shadow;"

      - name: Execute PostgreSQL integration tests
        env:
          DB_DRIVER: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: sentinel_pg_test
          DB_USERNAME: postgres
          DB_PASSWORD: password
        run: vendor/bin/phpunit --filter PostgresIntegrationTest

  test-mysql:
    name: MySQL Integration (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
        dependency-version: [prefer-stable]

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: sentinel_my_test
          MYSQL_ROOT_PASSWORD: password
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pdo, mysql, pdo_mysql
          coverage: none

      - name: Install dependencies
        run: composer update --${{ matrix.dependency-version }} --prefer-dist --no-interaction

      - name: Create MySQL shadow test database
        run: |
          mysql -h 127.0.0.1 -P 3306 -u root -ppassword -e "CREATE DATABASE sentinel_my_shadow;"

      - name: Execute MySQL integration tests
        env:
          DB_DRIVER: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: sentinel_my_test
          DB_USERNAME: root
          DB_PASSWORD: password
        run: vendor/bin/phpunit --filter MysqlIntegrationTest
